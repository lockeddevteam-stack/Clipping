<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B09">
<meta name="robots" content="noindex">
<title>LOCKED Band</title>
<style>
:root{
  --bg:#0E0B09; --card:rgba(246,238,231,.055); --line:rgba(246,238,231,.09);
  --text:#F6EEE7; --text2:rgba(246,238,231,.64); --text3:rgba(246,238,231,.42);
  --accent:#FF7A1A; --good:#4CD38A; --warn:#FFC857; --bad:#FF5A5F; --heart:#FF375F;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 55% at 0% 0%,#2b1a0f 0%,transparent 55%),var(--bg);color:var(--text);font:17px/1.45 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.app{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(20px,env(safe-area-inset-left,0px))}
.lab{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
h1{font:800 34px/1.05 var(--sans);letter-spacing:-.03em;margin:6px 0 0;text-wrap:balance}
.sub{color:var(--text2);margin:10px 0 0;font-size:16px;text-wrap:pretty}
.view{display:flex;flex-direction:column;gap:16px;flex:1;animation:in .35s cubic-bezier(.2,.9,.25,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;font-size:15px;color:var(--text2);line-height:1.4}
.steps li b{color:var(--text);font-weight:650}
.steps i{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(255,122,26,.16);color:var(--accent);display:grid;place-items:center;font:700 13px var(--num);font-style:normal}
.spacer{flex:1}
.btn{appearance:none;border:0;width:100%;border-radius:999px;padding:17px 20px;font:700 17px var(--sans);letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.btn--go{background:var(--accent);color:#1a0d04}
.btn--soft{background:rgba(246,238,231,.08);color:var(--text)}
.btn--stop{background:rgba(255,90,95,.16);color:var(--bad)}
.link{background:none;border:0;color:var(--text2);font:600 15px var(--sans);padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(246,238,231,.25)}
.btn:focus-visible,.link:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.foot{font-size:13px;color:var(--text3);text-align:center;margin:0;text-wrap:balance}
.band{display:flex;align-items:center;gap:12px}
.band .dot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(76,211,138,.18);flex:none}
.band b{display:block;font-size:17px}
.band span{font-size:13px;color:var(--text3)}
.band .hr{margin-left:auto;text-align:right}
.band .hr b{font:800 22px/1 var(--num);color:var(--heart);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:8px auto 0}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font:800 88px/1 var(--num);letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:transform .12s}
.ring .big.pop{transform:scale(1.06)}
.ring .unit{font-size:15px;font-weight:650;color:var(--text3);margin-top:4px}
.ring .time{font:700 17px var(--num);color:var(--text2);margin-top:10px;font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;height:84px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text3);margin-top:6px;font-variant-numeric:tabular-nums}
.result{text-align:center}
.result .big{font:800 72px/1 var(--num);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:15px;font-weight:650}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{flex:none;width:52px;height:52px;border-radius:16px;border:0;background:rgba(246,238,231,.08);color:var(--text);font:600 24px var(--num);cursor:pointer}
.stepper input{flex:1;min-width:0;height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(246,238,231,.05);color:var(--text);font:800 26px var(--num);text-align:center;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.msg{border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.4}
.msg--warn{background:rgba(255,200,87,.12);color:var(--warn)}
.msg--bad{background:rgba(255,90,95,.12);color:#FF8E91}
.msg--good{background:rgba(76,211,138,.12);color:var(--good)}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(246,238,231,.12);border-top-color:var(--accent);animation:sp .9s linear infinite;margin:40px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.tick{width:72px;height:72px;border-radius:50%;background:rgba(76,211,138,.15);color:var(--good);display:grid;place-items:center;margin:34px auto 6px}
.copyrow{display:flex;gap:8px;align-items:center;background:rgba(246,238,231,.05);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:13px var(--mono);color:var(--text2);word-break:break-all}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{display:flex;flex-direction:column}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-size:14px;font-weight:650;color:var(--text2)}
.form input{height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(246,238,231,.05);color:var(--text);font:600 17px var(--sans);padding:0 14px;outline:none}
.form input:focus{border-color:rgba(255,122,26,.6)}
.codein{font:800 28px var(--num)!important;letter-spacing:.35em;text-align:center}
.diag{margin-top:8px;font:12px/1.4 var(--mono);opacity:.8;word-break:break-word}
.link--quiet{color:var(--text3);font-size:14px}
a.link{text-align:center;display:block}
.band .dot.off{background:var(--text3);box-shadow:none}
.bmeta{min-width:0}
.band .hr span{display:block;font-size:12px;color:var(--text3)}
.sync .big{font:800 34px/1.1 var(--num);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:9px;background:rgba(246,238,231,.08);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .6s ease}
.sline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--text3);margin-top:8px;font-variant-numeric:tabular-nums}
.nightv{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
.nclock{font:200 84px/1 var(--num);color:rgba(246,238,231,.22);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nline{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(246,238,231,.3)}
.ndot{width:7px;height:7px;border-radius:50%;background:rgba(76,211,138,.55)}
.ndot.off{background:rgba(246,238,231,.25)}
.nbpm{font:600 15px var(--num);color:rgba(255,55,95,.4)}
.nhint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);font-size:12px;color:rgba(246,238,231,.16)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="band.js?v=9"></script>
</body>
</html>
