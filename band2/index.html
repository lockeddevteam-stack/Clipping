<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B09">
<meta name="robots" content="noindex">
<title>LOCKED Band</title>
<style>
:root{
  --bg:#0E0B09; --card:rgba(246,238,231,.055); --card2:rgba(246,238,231,.085); --line:rgba(246,238,231,.09);
  --text:#F6EEE7; --text2:rgba(246,238,231,.64); --text3:rgba(246,238,231,.42);
  --accent:#FF7A1A; --good:#4CD38A; --warn:#FFC857; --bad:#FF5A5F; --heart:#FF375F;
  --deep:#7B6DFF; --light:#4E7DB8; --rem:#B58BF5; --awake:#9C948E;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{background:radial-gradient(120% 50% at 0% 0%,#2b1a0f 0%,transparent 55%),var(--bg);color:var(--text);font:17px/1.45 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior-y:none}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.lab{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
h1{font:800 32px/1.05 var(--sans);letter-spacing:-.03em;margin:4px 0 14px}
h2{font:700 13px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--text2)} .faint{color:var(--text3)} .small{font-size:13px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--text3);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 4px rgba(76,211,138,.18)}
.dot.mid{background:var(--warn)}
.bpm{font:800 26px/1 var(--num);color:var(--heart);font-variant-numeric:tabular-nums}
.bpm small{font:600 12px var(--sans);color:var(--text3);margin-left:3px}
.heart{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-1px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}}
.btn{appearance:none;border:0;width:100%;border-radius:999px;padding:16px 20px;font:700 17px var(--sans);letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s;color:var(--text);background:rgba(246,238,231,.08);min-height:52px}
.btn:active{transform:scale(.98)} .btn:disabled{opacity:.4}
.btn--go{background:var(--accent);color:#1a0d04} .btn--stop{background:rgba(255,90,95,.16);color:var(--bad)}
.btn--sm{width:auto;padding:10px 16px;font-size:15px;min-height:40px}
.btn:focus-visible,.tab:focus-visible,.ex:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.msg{border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.4;margin-bottom:12px}
.msg--warn{background:rgba(255,200,87,.12);color:var(--warn)} .msg--bad{background:rgba(255,90,95,.12);color:#FF8E91} .msg--good{background:rgba(76,211,138,.12);color:var(--good)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(14,11,9,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
.tabs>div{display:flex;width:100%;max-width:520px}
.tab{flex:1;appearance:none;border:0;background:none;color:var(--text3);font:600 11px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;min-height:48px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--accent)}
.hero{display:flex;align-items:center;gap:18px}
.dial{position:relative;width:118px;height:118px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 34px/1 var(--num)}
.dial b small{font:600 11px var(--mono);letter-spacing:.1em;color:var(--text3);margin-top:4px;text-transform:uppercase}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.kv em{display:block;font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);font-style:normal}
.kv b{font:700 20px/1.3 var(--num);font-variant-numeric:tabular-nums}
.kv b small{font:600 12px var(--sans);color:var(--text3);margin-left:2px}
canvas.chart{display:block;width:100%;height:150px}
.axis{display:flex;justify-content:space-between;font:600 10.5px var(--mono);color:var(--text3);margin-top:4px;letter-spacing:.06em}
.nightnav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nightnav b{flex:1;text-align:center;font-size:16px}
.nav{width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:20px;cursor:pointer}
.nav:disabled{opacity:.3}
/* scrubber */
.scrub{user-select:none;-webkit-user-select:none}
.scrub__read{height:30px;display:flex;align-items:center;margin-bottom:6px}
.scrub__sum{font-size:15px;color:var(--text2)}
.scrub__at{display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap;animation:fadein .12s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scrub__time{font:700 17px var(--num);font-variant-numeric:tabular-nums}
.scrub__sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.scrub__bpm{margin-left:auto;color:var(--heart);font:800 17px var(--num);font-variant-numeric:tabular-nums}
.scrub__plot{position:relative;height:220px;touch-action:pan-y;cursor:crosshair;border-radius:12px;outline:none}
.scrub__plot:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.scrub__plot canvas{position:absolute;inset:0;width:100%;height:100%}
.scrub__lanes{position:absolute;left:4px;top:8px;height:calc(62% - 8px);display:flex;flex-direction:column;justify-content:space-around;pointer-events:none;font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.scrub__empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--text3);font-size:15px;text-align:center;padding:20px}
.scrub__ticks{position:relative;height:16px;margin-top:6px}
.scrub__ticks span{position:absolute;transform:translateX(-50%);font:600 10.5px var(--mono);color:var(--text3)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.legend span{display:flex;flex-direction:column;gap:2px}
.legend i{width:16px;height:4px;border-radius:2px;display:block;margin-bottom:4px}
.legend b{font:700 16px var(--num);font-variant-numeric:tabular-nums}
.legend em{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);font-style:normal}
/* live set */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:14px;text-align:left;font:650 16px var(--sans);cursor:pointer;min-height:64px;display:flex;flex-direction:column;gap:2px}
.ex span{font:500 12.5px var(--sans);color:var(--text3)}
.ex[aria-pressed=true]{border-color:var(--accent);background:rgba(255,122,26,.1)}
.ring{position:relative;width:min(74vw,290px);aspect-ratio:1;margin:6px auto 4px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font:800 112px/1 var(--num);letter-spacing:-.05em;font-variant-numeric:tabular-nums;transition:transform .14s cubic-bezier(.2,.9,.3,1.4)}
.ring .big.pop{transform:scale(1.12)}
.ring .unit{font-size:15px;font-weight:650;color:var(--text3)}
.ring .sub{font:700 16px var(--num);color:var(--text2);margin-top:8px;font-variant-numeric:tabular-nums}
.pulse{position:absolute;inset:8%;border-radius:50%;border:3px solid var(--accent);opacity:0}
.pulse.go{animation:ring .5s ease-out}
@keyframes ring{from{opacity:.7;transform:scale(.9)}to{opacity:0;transform:scale(1.12)}}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{flex:none;width:52px;height:52px;border-radius:16px;border:0;background:var(--card2);color:var(--text);font:600 26px var(--num);cursor:pointer}
.stepper output{flex:1;text-align:center;font:800 40px var(--num);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:12px;padding:6px 0}
.switch{position:relative;width:51px;height:31px;border-radius:16px;border:0;background:rgba(246,238,231,.16);flex:none;cursor:pointer;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s}
.switch[aria-checked=true]{background:var(--good)} .switch[aria-checked=true]::after{transform:translateX(20px)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.mono{font:12px/1.5 var(--mono);color:var(--text2);overflow-wrap:anywhere}
.trace{display:block;width:100%;height:70px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="tabs" aria-label="Sections"><div role="tablist" id="tabs"></div></nav>
<script src="core.js?v=2"></script>
<script src="scrub.js?v=2"></script>
<script src="bridge.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
